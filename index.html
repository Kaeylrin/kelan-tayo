    <!-- First-load splash. Inline so it paints before the app's CSS and JS arrive;
         src/utils/splash.js fades it out once the app and fonts are ready. -->
    <style>
      html { background: #1B3A87; }
      #splash {
        position: fixed; inset: 0; z-index: 3000;
        display: grid; place-content: center; justify-items: center; gap: 26px;
        background-color: #1B3A87;
        background-image: linear-gradient(rgba(246,241,231,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(246,241,231,.05) 1px, transparent 1px);
        background-size: 36px 36px;
        transition: opacity .5s cubic-bezier(.22,.61,.36,1), visibility .5s;
      }
      #splash.is-leaving { opacity: 0; visibility: hidden; }
      #splash img { width: 150px; height: auto; animation: splash-in .8s cubic-bezier(.22,.61,.36,1) both; }
      #splash .line {
        position: relative; overflow: hidden; width: 60px; height: 3px; border-radius: 3px;
        background: rgba(246,241,231,.16);
        animation: splash-in .8s cubic-bezier(.22,.61,.36,1) .2s both;
      }
      #splash .line::after {
        content: ""; position: absolute; inset: 0; background: #FFC64B;
        transform: scaleX(0); transform-origin: 0;
        animation: splash-draw 1.3s cubic-bezier(.22,.61,.36,1) .3s infinite;
      }
      @keyframes splash-in { from { opacity: 0; transform: translateY(6px); } }
      @keyframes splash-draw {
        50% { transform-origin: 0; transform: scaleX(1); }
        50.1% { transform-origin: 100%; transform: scaleX(1); }
        to { transform-origin: 100%; transform: scaleX(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .line, #splash .line::after { animation: none; }
        #splash { transition-duration: .01ms; }
      }
    </style>
    <noscript><style>#splash { display: none; }</style></noscript>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/brand-wordmark.png" alt="" width="480" height="400" />
      <span class="line"></span>
    </div>
    <div id="root"></div>
    <noscript>Kelan Tayo needs JavaScript to work. Please enable it and reload the page.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
